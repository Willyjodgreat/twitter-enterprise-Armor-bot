services:
  - type: web
    name: twitter-enterprise
    env: node
    buildCommand: cd src && npm install
    startCommand: cd src && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: X_USERNAME
        sync: false
      - key: X_PASSWORD
        sync: false
      - key: APIFY_PROXY_TOKEN
        sync: false
        optional: true
      - key: SCRAPINGBEE_KEY
        sync: false
        optional: true
      - key: SESSION_SECRET
        value: change-this-to-random-string-in-render-dashboard
    plan: free
    healthCheckPath: /health
    disk:
      name: sessions
      mountPath: /opt/render/project/src/sessions
      sizeGB: 1
